name: Kaynak teshis
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - name: Yahoo
        run: |
          curl -s -o /dev/null -w "yahoo q1: %{http_code}\n" -A "Mozilla/5.0" "https://query1.finance.yahoo.com/v8/finance/chart/THYAO.IS?range=1mo&interval=1d"
          curl -s -o /dev/null -w "yahoo q2: %{http_code}\n" -A "Mozilla/5.0" "https://query2.finance.yahoo.com/v8/finance/chart/THYAO.IS?range=1mo&interval=1d"
      - name: Is Yatirim
        run: |
          curl -s -w "\nisyatirim: %{http_code}\n" -A "Mozilla/5.0" "https://www.isyatirim.com.tr/_layouts/15/Isyatirim.Website/Common/Data.aspx/HisseTekil?hisse=THYAO&startdate=10-11-2026&enddate=20-11-2026" | head -c 600
