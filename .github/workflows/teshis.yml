name: Kaynak teshis
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python ile 12 hisse
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, 'tarayici')
          import calistir as c
          for s in ['THYAO.IS','AKBNK.IS','GARAN.IS','ASELS.IS','XU100.IS','BIMAS.IS','EREGL.IS','KCHOL.IS','SASA.IS','TUPRS.IS','FROTO.IS','SISE.IS']:
              t = time.time()
              r = c.indir(s)
              print(s, 'OK' if r else 'YOK', round(time.time()-t,1), c.HATALAR.get(s))
          PY
